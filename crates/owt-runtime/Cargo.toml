[package]
name = "owt-runtime"
version = "0.1.0"
description = "Shared bootstrap: layered config, tracing/OTel/Prometheus init, graceful shutdown, task supervision."
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
owt-domain.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
figment.workspace = true
serde.workspace = true
thiserror.workspace = true
# Worker factory error channel: supervised workers return `anyhow::Result<()>`.
anyhow.workspace = true

[dev-dependencies]
# Integration tests drive the supervisor/shutdown on a paused clock.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
# `figment::Jail` (isolated env/CWD for config tests) is behind figment's `test` feature.
figment = { workspace = true, features = ["test"] }
