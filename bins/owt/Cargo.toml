[package]
name = "owt"
version = "0.1.0"
description = "The owt ratatui TUI client. Depends only on owt-client + owt-api-types."
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# A thin library target holds the pure app core (AppState/Msg/update/view + screens),
# so unit tests and golden-frame tests drive it without a terminal. `main.rs` is the
# process shell (args, config, logging, terminal, event loop) around this core.
[lib]
name = "owt_tui"
path = "src/lib.rs"

[[bin]]
name = "owt"
path = "src/main.rs"

# The TUI touches server internals only through owt-api-types / owt-client — the
# compile-time enforcement of ADR-0010 (layering rule 2).
[dependencies]
owt-client.workspace = true
owt-api-types.workspace = true
ratatui.workspace = true
# event-stream: the async crossterm EventStream feeding the TEA loop.
crossterm = { workspace = true, features = ["event-stream"] }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
# Async EventStream + tick/mpsc merge for the event loop.
futures.workspace = true
# Config schema (owt-client) + figment layered load; CLI flags; file logging.
serde.workspace = true
figment.workspace = true
clap.workspace = true
time.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Golden-frame snapshots over ratatui TestBackend (testing-strategy.md § TUI E2E).
insta.workspace = true
# Integration tests drive the pure core directly, so they name these types (normal
# deps aren't visible to the separate test crate).
owt-client.workspace = true
owt-api-types.workspace = true
ratatui.workspace = true
crossterm.workspace = true
