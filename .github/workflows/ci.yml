# CI — the contract in docs/ops/ci-cd-and-release.md § Workflow set (`ci.yml`).
# This phase implements the runnable stages: fmt → clippy -D warnings → build →
# test (nextest) → MSRV → docs job. Integration (service containers), API/OpenAPI
# additive diff, and TUI golden frames land with their tests in later phases.
#
# Actions are pinned by commit SHA per the supply-chain ramp
# (ci-cd-and-release.md § Supply-chain ramp); the trailing comment is the human tag.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: fmt · clippy · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: Install cargo-nextest
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb # v2
        with:
          tool: nextest
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test (nextest)
        run: cargo nextest run --workspace --locked
      - name: Doctests
        run: cargo test --workspace --doc --locked

  msrv:
    name: MSRV (latest stable minus two)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Keep in sync with `rust-version` in Cargo.toml.
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      # Explicit `+toolchain` overrides rust-toolchain.toml (which pins stable).
      - name: Check on MSRV
        run: cargo +1.95.0 check --workspace --locked

  docs:
    name: docs vault
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # Frontmatter lint, index-summary sync, banned-term grep, [[wikilink]] grep,
      # mermaid parse, size discipline, and relative-link integrity.
      - name: Vault validator
        run: python3 scripts/verify-docs.py
      # lychee offline link check (ci-cd-and-release.md docs job).
      - name: Link check (lychee, offline)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: "--offline --no-progress docs README.md CONTRIBUTING.md SECURITY.md"
          fail: true
